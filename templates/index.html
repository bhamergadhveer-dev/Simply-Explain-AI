<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explain It Simply</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f3ec;
            --panel: #fffdf8;
            --panel-2: #faf6ec;
            --ink: #1c2420;
            --muted: #66716a;
            --line: #e3dccb;
            --accent: #0f766e;
            --accent-hover: #0b5f58;
            --on-accent: #fff;
            --danger: #b42318;
            --danger-soft: #fdecea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1412;
                --panel: #151d1a;
                --panel-2: #1a2420;
                --ink: #e9efeb;
                --muted: #94a39b;
                --line: #263330;
                --accent: #3fc1b0;
                --accent-hover: #5ed3c4;
                --on-accent: #06211d;
                --danger: #ff8a7a;
                --danger-soft: #3a1b17;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            height: 100dvh;
            padding: 14px;
        }

        .card {
            height: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 3fr;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
        }

        .input-side {
            padding: 24px;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .result-side {
            padding: 24px;
            background: var(--panel-2);
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        h1 {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 24px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .lead {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 18px;
        }

        form {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        textarea {
            flex: 1;
            min-height: 80px;
            width: 100%;
            padding: 12px 14px;
            resize: none;
            font: inherit;
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink);
            background: var(--panel);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .go {
            margin-top: 12px;
            padding: 13px;
            cursor: pointer;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            color: var(--on-accent);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
        }

        .go:hover {
            background: var(--accent-hover);
        }

        .go:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        h2 {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .result-box {
            flex: 1;
            min-height: 0;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow-y: auto;
            overflow-wrap: anywhere;
        }

        .empty {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .answer {
            font-size: 15px;
            line-height: 1.7;
        }

        .answer p {
            margin-bottom: 12px;
        }

        .answer h4 {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 16px;
            margin: 14px 0 6px;
        }

        .answer ul,
        .answer ol {
            margin: 0 0 12px 20px;
        }

        .answer li {
            margin-bottom: 4px;
        }

        .answer code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: .9em;
            background: var(--panel-2);
            border: 1px solid var(--line);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .answer pre {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin-bottom: 12px;
        }

        .answer pre code {
            background: none;
            border: 0;
            padding: 0;
        }

        .answer>*:last-child {
            margin-bottom: 0;
        }

        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
        }

        .skel {
            display: grid;
            gap: 10px;
        }

        .skel span {
            display: block;
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--line) 25%, var(--panel-2) 50%, var(--line) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s linear infinite;
        }

        .skel span:nth-child(1) {
            width: 90%;
        }

        .skel span:nth-child(2) {
            width: 75%;
        }

        .skel span:nth-child(3) {
            width: 55%;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .skel span {
                animation: none;
            }
        }

        @media (max-width: 760px) {
            body {
                padding: 8px;
            }

            .card {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            .input-side {
                border-right: 0;
                border-bottom: 1px solid var(--line);
                padding: 16px;
            }

            .result-side {
                padding: 16px;
            }

            h1 {
                font-size: 20px;
            }

            .lead {
                display: none;
            }

            textarea {
                flex: none;
                height: 90px;
            }

            h2 {
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <section class="input-side">
            <h1>What do you want to learn?</h1>
            <p class="lead">Enter a topic or question and get a simple explanation.</p>

            <form id="explainForm">
                <textarea id="text" maxlength="2500" required
                    placeholder="e.g. Explain Python functions with a real-life example..."></textarea>
                <button type="submit" class="go" id="go">Explain this topic →</button>
            </form>
        </section>

        <section class="result-side">
            <h2>Your explanation</h2>
            <div class="result-box" aria-live="polite">
                <div class="empty" id="placeholder">Your explanation will appear here.</div>
                <div id="out"></div>
            </div>
        </section>

    </main>

    <script>
        const form = document.getElementById("explainForm");
        const text = document.getElementById("text");
        const button = document.getElementById("go");
        const out = document.getElementById("out");
        const placeholder = document.getElementById("placeholder");

        text.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") form.requestSubmit();
        });

        function esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function inline(s) {
            return esc(s)
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
        }
        function render(md) {
            const lines = md.replace(/\r/g, "").split("\n");
            let html = "", list = null, inCode = false, buf = [];
            const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };

            for (const raw of lines) {
                if (raw.trim().startsWith("```")) {
                    if (inCode) { html += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>"; buf = []; inCode = false; }
                    else { closeList(); inCode = true; }
                    continue;
                }
                if (inCode) { buf.push(raw); continue; }

                const line = raw.trim();
                if (!line) { closeList(); continue; }

                let m;
                if ((m = line.match(/^#{1,4}\s+(.*)/))) {
                    closeList(); html += "<h4>" + inline(m[1]) + "</h4>";
                } else if ((m = line.match(/^[-*•]\s+(.*)/))) {
                    if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
                    html += "<li>" + inline(m[1]) + "</li>";
                } else if ((m = line.match(/^\d+[.)]\s+(.*)/))) {
                    if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
                    html += "<li>" + inline(m[1]) + "</li>";
                } else {
                    closeList(); html += "<p>" + inline(line) + "</p>";
                }
            }
            if (inCode && buf.length) html += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
            closeList();
            return html;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = text.value.trim();
            if (!question) { text.focus(); return; }

            button.disabled = true;
            button.textContent = "Explaining...";
            placeholder.hidden = true;
            out.innerHTML = '<div class="skel"><span></span><span></span><span></span></div>';

            try {
                const response = await fetch("/api/explain", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: question })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Something went wrong.");

                out.innerHTML = '<div class="answer">' + render(data.answer || "No explanation returned.") + "</div>";
                out.parentElement.scrollTop = 0;
            } catch (error) {
                out.innerHTML = '<div class="error"></div>';
                out.firstChild.textContent = error.message || "Unable to connect. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Explain this topic →";
            }
        });
    </script>
</body>

</html>
